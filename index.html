<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta http-equiv="Content-Security-Policy" content= "default-src 'self'; script-src 'self'; style-src 'self' http://fonts.googleapis.com; font-src https://fonts.gstatic.com;">

    <meta http-equiv="X-Content-Security-Policy" content="defualt-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com;">
    <title>Hello from Electron renderer!</title>
   <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id = "container">

      <div id="top-bar">
        <!-- shows shop  -->
      <div id ="farm-stand"> </div>
      <div id="center-info">
         <!-- Displays money  -->
          <div id = "money-display"> Money: </div> 
          <div id="inventory-display"> Inventory: Tomatoes 0 | Grapes 0| Strawberries 0| Lettuce 0</div>
      </div>

       <div id="sell-stand"></div>
      <!-- creates shop menu (currently invisible) -->
      <div id="menus-wrapper">
        <div id ="shop-menu" class = "menu hidden">
        <h3>Buy Seeds!🌱</h3>
        <button id="tomatoes"> 
        <img src="images/tomato seed.png" alt="Tomato Icon" data-tooltip="A classic, juicy tomato.">
        Tomatoes $5 </button>
        <button id = "strawberries">
        <img src="images/strawberry seed.png" alt="Strawberry Icon" data-tooltip="A sweet, red strawberry.">
        Strawberries $5</button>
        <button id = "grapes">  
        <img src="images/grape seed.png" alt="Grapes Icon" data-tooltip="A bunch, of plump grapes.">
        Grapes $5</button>
        <button id = "lettuce"> <img src="images/lettuce seed.png" alt="Lettuce Icon" data-tooltip="Crisp, green lettuce.">
        Lettuce $5</button>
      </div>
       <div id = "sell-menu" class="menu hidden">
        <h2>SELL HERE</h2>
        <div id ="sell-options"></div>
       </div>
          
      </div>
      
      </div>

      <div id="main-game-area">
        
        <div id="pond"></div>
        

        <!-- field container -->
        <div id="field"></div>
      </div>
     
    </div>


    <script src="main.js"></script>
    <script src="game.js"></script>
  </body>
</html>
